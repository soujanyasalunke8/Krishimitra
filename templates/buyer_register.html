
<!DOCTYPE html>
<html>
<head>
    <title>Buyer Registration - Krishimitra</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f7f2;
            padding: 30px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0 18px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #168653;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Buyer Registration</h2>

    <form action="/register_buyer" method="POST">

        <label>Buyer / Company Name</label>
        <input type="text" name="buyer_name" required>

        <label>Mobile Number</label>
        <input type="tel" name="mobile"
               pattern="[0-9]{10}" required>

        <label>Email Address</label>
        <input type="email" name="email" required>

        <label>Business Type</label>
        <select name="business_type" required>
            <option value="">Select Business Type</option>
            <option>Wholesaler</option>
            <option>Retailer</option>
            <option>Food Processing Company</option>
            <option>Exporter</option>
            <option>Other</option>
        </select>

        <label>State</label>
        <input type="text" name="state" required>

        <label>District</label>
        <input type="text" name="district" required>

        <label>Crop Interested In</label>
        <input type="text" name="crop" required>

        <button type="submit">Register Buyer</button>
    </form>
</div>
</body>
</html>
